<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .quote-box {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin: 20px 0;
        }

        button {
            background-color: #0073e6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>

<div class="quote-box">
    <h1>Random Quote Generator</h1>
    <p id="quote-text">"Click the button to get a random quote."</p>
    <button onclick="generateQuote()">Generate Quote</button>
</div>

<script>
    // Array of quotes
    const quotes = [
        '"The only way to do great work is to love what you do." - Steve Jobs',
        '"Success is not the key to happiness. Happiness is the key to success." - Albert Schweitzer',
        '"It does not matter how slowly you go as long as you do not stop." - Confucius',
        '"The future belongs to those who believe in the beauty of their dreams." - Eleanor Roosevelt',
        '"In three words I can sum up everything I\'ve learned about life: it goes on." - Robert Frost',
        '"The purpose of our lives is to be happy." - Dalai Lama',
        '"Life is what happens when you\'re busy making other plans." - John Lennon',
        '"Get busy living or get busy dying." - Stephen King',
        '"You have within you right now, everything you need to deal with whatever the world can throw at you." - Brian Tracy',
        '"Believe you can and you\'re halfway there." - Theodore Roosevelt'
    ];

    // Function to generate a random quote
    function generateQuote() {
        // Generate a random index to select a quote from the array
        const randomIndex = Math.floor(Math.random() * quotes.length);
        // Display the quote on the webpage
        document.getElementById('quote-text').textContent = quotes[randomIndex];
    }
</script>

</body>
</html>
